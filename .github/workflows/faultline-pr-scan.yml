# Install this trusted workflow on the selected repository's default branch.
# It submits metadata only; analysis runs through Faultline's Keystone pipeline.
name: Faultline PR scan
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  faultline-submit:
    if: >-
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == vars.FAULTLINE_BASE_BRANCH
    runs-on: [self-hosted, "${{ vars.FAULTLINE_RUNNER_LABEL }}"]
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.scan.outputs.run_id }}
      terminal_state: ${{ steps.scan.outputs.terminal_state }}
    steps:
      - name: Scan exact PR pair
        id: scan
        shell: bash
        env:
          FAULTLINE_URL: ${{ vars.FAULTLINE_URL }}
          FAULTLINE_BASE_BRANCH: ${{ vars.FAULTLINE_BASE_BRANCH }}
          FAULTLINE_ALLOW_HTTP: ${{ vars.FAULTLINE_ALLOW_HTTP }}
          FAULTLINE_TOKEN: ${{ secrets.FAULTLINE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          accepted=false
          fail() {
            printf '%s\n' "$1" >&2
            if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then
              if [[ $accepted == true ]]; then
                printf 'Analysis unavailable or unconfirmed; this check failed closed.\n' >> "$GITHUB_STEP_SUMMARY"
              else
                printf 'Faultline submission failed (intake not confirmed): %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit 1
          }
          command -v jq >/dev/null || fail 'Runner requires installed jq.'
          command -v curl >/dev/null || fail 'Runner requires installed curl >= 8.4.0.'
          version=$(curl -q --version)
          [[ $version =~ ^curl\ ([0-9]+)\.([0-9]+)\.([0-9]+) ]] || fail 'Cannot identify installed curl version.'
          (( BASH_REMATCH[1] > 8 || (BASH_REMATCH[1] == 8 && BASH_REMATCH[2] >= 4) )) || fail 'Runner requires installed curl >= 8.4.0; no submission attempted.'
          [[ ${GITHUB_EVENT_NAME:-} == pull_request_target ]] || fail 'Expected pull_request_target event.'
          [[ -n ${FAULTLINE_BASE_BRANCH:-} ]] || fail 'Set trusted FAULTLINE_BASE_BRANCH repository variable.'
          [[ -n ${GITHUB_STEP_SUMMARY:-} ]] || fail 'Missing Actions job summary path.'
          [[ -n ${GITHUB_OUTPUT:-} ]] || fail 'Missing Actions output path.'
          [[ ${FAULTLINE_URL:-} =~ ^https?://([A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?|\[[0-9A-Fa-f:]+\])(:[0-9]{1,5})?$ ]] || fail 'Set FAULTLINE_URL to the trusted API origin, without path, credentials, query or fragment.'
          if [[ $FAULTLINE_URL == http://* && ${FAULTLINE_ALLOW_HTTP:-} != true ]]; then fail 'HTTP requires explicit operator FAULTLINE_ALLOW_HTTP=true; prefer trusted HTTPS.'; fi
          [[ ${GITHUB_REPOSITORY:-} =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail 'Missing canonical workflow repository.'
          for value in "${GITHUB_REPOSITORY_ID:-}" "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}"; do
            [[ $value =~ ^[1-9][0-9]*$ ]] || fail 'Missing positive workflow repository/run/attempt ID.'
          done
          [[ -f ${GITHUB_EVENT_PATH:-} && -r $GITHUB_EVENT_PATH ]] || fail 'Missing readable event JSON.'
          (( $(wc -c < "$GITHUB_EVENT_PATH") <= 1048576 )) || fail 'Event exceeds 1 MiB.'
          umask 077
          private=$(mktemp -d)
          trap 'rm -rf -- "$private"' EXIT
          jq -es --arg repo "$GITHUB_REPOSITORY" --argjson rid "$GITHUB_REPOSITORY_ID" \
            --arg branch "$FAULTLINE_BASE_BRANCH" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
            def positive: type == "number" and . > 0 and floor == .;
            def sha: type == "string" and length == 40 and test("^[0-9a-f]{40}$");
            select(length == 1) | .[0] |
            select(type == "object" and (.action == "opened" or .action == "synchronize" or .action == "reopened")) |
            select(.repository.id == $rid and .repository.full_name == $repo) |
            select(.number | positive) | select(.pull_request.number == .number) |
            select(.pull_request.base.repo.id == $rid and .pull_request.head.repo.id == $rid) |
            select(.pull_request.base.repo.full_name == $repo and .pull_request.head.repo.full_name == $repo) |
            select(.pull_request.base.ref == $branch) |
            select(.pull_request.base.sha | sha) | select(.pull_request.head.sha | sha) |
            {schema_version:1, repository_id:$rid, repository:$repo, pull_request:.number,
             base_branch:$branch, base_sha:.pull_request.base.sha, head_sha:.pull_request.head.sha,
             head_repository_id:$rid, event_action:.action, workflow_run_id:$run, workflow_run_attempt:$attempt}
            ' "$GITHUB_EVENT_PATH" > "$private/request" 2>/dev/null || fail 'Rejected event identity, branch, action or exact commit pair.'
          (( $(wc -c < "$private/request") <= 16384 )) || fail 'Request exceeds 16 KiB.'
          [[ -n ${FAULTLINE_TOKEN:-} && $FAULTLINE_TOKEN != *$'\n'* && $FAULTLINE_TOKEN != *$'\r'* ]] || fail 'Set the existing instance token as FAULTLINE_TOKEN Actions secret.'
          printf 'Authorization: Bearer %s\nContent-Type: application/json\nAccept: application/json\n' "$FAULTLINE_TOKEN" > "$private/headers"
          unset FAULTLINE_TOKEN
          for attempt in 1 2 3; do
            : > "$private/response"
            rc=0
            status=$(curl -q --silent --proto '=https,http' --connect-timeout 10 --max-time 30 \
              --max-filesize 65536 --header "@$private/headers" --data-binary "@$private/request" \
              --output "$private/response" --write-out '%{http_code}' \
              "$FAULTLINE_URL/v1/github/pr-runs" 2>/dev/null) || rc=$?
            (( rc != 63 )) || fail 'Response exceeds 64 KiB; no retry.'
            if [[ -f $private/response ]]; then (( $(wc -c < "$private/response") <= 65536 )) || fail 'Response exceeds 64 KiB; no retry.'; fi
            if (( rc == 0 )) && [[ $status == 200 || $status == 201 ]]; then break; fi
            retry=false
            case $rc in 5|6|7|18|28|35|52|55|56|60|92|95) retry=true ;; esac
            if (( rc == 0 )) && [[ $status == 429 || $status =~ ^5[0-9][0-9]$ ]]; then retry=true; fi
            [[ $retry == true && $attempt != 3 ]] || fail "Faultline intake rejected or unavailable (HTTP $status, curl $rc)."
            sleep "$attempt"
          done
          identity() {
            jq -ers --arg expected "$1" --slurpfile request "$private/request" '
            select(length == 1) | .[0] | select(type == "object") |
            select(.id | type == "string" and length == 36 and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) |
            select($expected == "" or .id == $expected) |
            select(.base_ref == $request[0].base_sha and .delta_ref == $request[0].head_sha) |
            select(.trigger.schema_version == 1 and .trigger.source == "github-actions") |
            select(.trigger.repository_id == $request[0].repository_id and .trigger.repository == $request[0].repository) |
            select(.trigger.pull_request == $request[0].pull_request and .trigger.base_branch == $request[0].base_branch) |
            select(.trigger.base_sha == $request[0].base_sha and .trigger.head_sha == $request[0].head_sha) | .id
            ' "$private/response" 2>/dev/null
          }
          id=$(identity '') || fail 'Invalid intake response UUID, repository, PR or exact pair.'
          duration=$(jq -er '.duration_seconds | select(type == "number" and . > 0 and . <= 6000 and floor == .)' "$private/response" 2>/dev/null) || fail 'Invalid admitted scan duration.'
          accepted=true
          printf 'run_id=%s\n' "$id" >> "$GITHUB_OUTPUT"
          base=$(jq -r .base_sha "$private/request")
          head=$(jq -r .head_sha "$private/request")
          printf 'Faultline intake accepted; awaiting scan report.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Open persisted run](%s/ui/#/runs/%s)\n\nBase: `%s`\n\nHead: `%s`\n\n' "$FAULTLINE_URL" "$id" "$base" "$head" >> "$GITHUB_STEP_SUMMARY"
          printf 'Duplicate identity is the exact pair plus resolved analysis configuration. A rerun returns the original run; a new pair or configuration creates another run.\nCRS acceptance and budget expiry do not prove external source-download/build/fuzz execution health or repository safety.\n' >> "$GITHUB_STEP_SUMMARY"
          deadline=$(( $(date +%s) + duration + 900 ))
          remaining_budget() {
            remaining=$((deadline - $(date +%s)))
            (( remaining > 0 )) || fail 'Polling deadline expired.'
          }
          budget_sleep() {
            remaining_budget
            delay=$1
            (( delay <= remaining )) || delay=$remaining
            sleep "$delay"
          }
          while true; do
            for attempt in 1 2 3; do
              remaining_budget
              max_time=$remaining
              (( max_time <= 30 )) || max_time=30
              : > "$private/response"
              rc=0
              status=$(curl -q --silent --proto '=https,http' --connect-timeout 10 --max-time "$max_time" \
                --max-filesize 65536 --header "@$private/headers" --output "$private/response" \
                --write-out '%{http_code}' "$FAULTLINE_URL/v1/runs/$id" 2>/dev/null) || rc=$?
              remaining_budget
              (( rc != 63 )) || fail 'Response exceeds 64 KiB; no retry.'
              (( $(wc -c < "$private/response") <= 65536 )) || fail 'Response exceeds 64 KiB; no retry.'
              if (( rc == 0 )) && [[ $status == 200 ]]; then break; fi
              retry=false
              case $rc in 5|6|7|18|28|35|52|55|56|60|92|95) retry=true ;; esac
              if (( rc == 0 )) && [[ $status == 429 || $status =~ ^5[0-9][0-9]$ ]]; then retry=true; fi
              [[ $retry == true && $attempt != 3 ]] || fail 'Scan report unavailable; transport rejected or retries exhausted.'
              budget_sleep "$attempt"
            done
            identity "$id" >/dev/null || fail 'Invalid persisted run identity.'
            fields=$(jq -er '
              def count: type == "number" and . >= 0 and . <= 2147483647 and floor == .;
              select(.state == "pending" or .state == "launching" or .state == "running" or
                     .state == "proven" or .state == "no-findings" or .state == "failed") |
              select(.error | type == "string") |
              select(.fault_count | count) | select(.patch_count | count) |
              [.state, .fault_count, .patch_count] | @tsv
              ' "$private/response" 2>/dev/null) || fail 'Invalid scan report state or counts.'
            IFS=$'\t' read -r state faults patches <<< "$fields"
            case $state in
              pending|launching|running)
                jq -e '.error == ""' "$private/response" >/dev/null 2>&1 || fail 'Nonterminal scan reports an error.'
                budget_sleep 15
                continue ;;
              proven)
                printf 'terminal_state=proven\n' >> "$GITHUB_OUTPUT"
                printf 'Faults: %s; candidate patches: %s.\nFindings reported; this exact-pair check fails even when candidate patches exist.\n' "$faults" "$patches" >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
              failed)
                printf 'terminal_state=failed\n' >> "$GITHUB_OUTPUT"
                printf 'Faults: %s; candidate patches: %s.\n' "$faults" "$patches" >> "$GITHUB_STEP_SUMMARY"
                fail 'Scan reports failure.' ;;
              no-findings)
                printf 'terminal_state=no-findings\n' >> "$GITHUB_OUTPUT"
                printf 'Faults: %s; candidate patches: %s.\n' "$faults" "$patches" >> "$GITHUB_STEP_SUMMARY"
                jq -e '
                  def count: type == "number" and . >= 0 and . <= 2147483647 and floor == .;
                  .state == "no-findings" and .error == "" and
                  (.ended_at | type == "string" and test("^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\.[0-9]{1,9})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\\z")) and
                  (.fault_count | count) and .fault_count == 0 and
                  (.patch_count | count) and .patch_count == 0 and
                  .summary.schema_version == 1 and .summary.profile == "buttercup-crs-client" and
                  .summary.task_type == "delta" and
                  (.summary.task_status == "succeeded" or .summary.task_status == "expired") and
                  .summary.crs_submission_status == "success" and
                  (.summary.pov_count | count) and .summary.pov_count == 0 and
                  (.summary.analysis_unavailable | count) and .summary.analysis_unavailable == 0 and
                  (.summary.patch_count | count) and .summary.patch_count == 0 and
                  (.summary.bundle_count | count) and .summary.bundle_count == 0
                  ' "$private/response" >/dev/null 2>&1 || fail 'Terminal scan report is incomplete or inconsistent.'
                printf 'No findings reported within the scan budget.\n' >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
          done
  faultline-issues:
    needs: [faultline-submit]
    if: >-
      always() &&
      needs.faultline-submit.outputs.terminal_state == 'proven' &&
      vars.FAULTLINE_PUBLISH_ISSUES == 'true' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == vars.FAULTLINE_BASE_BRANCH
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: faultline-publication-${{ github.repository_id }}
      cancel-in-progress: false
    runs-on: [self-hosted, "${{ vars.FAULTLINE_RUNNER_LABEL }}"]
    timeout-minutes: 15
    outputs:
      issue_result: ${{ steps.publish.outputs.issue_result }}
      issue_count: ${{ steps.publish.outputs.issue_count }}
    steps:
      - name: Publish own reported finding groups
        id: publish
        shell: bash
        env:
          FAULTLINE_RUN_ID: ${{ needs.faultline-submit.outputs.run_id }}
          FAULTLINE_PUBLISH_ISSUES: ${{ vars.FAULTLINE_PUBLISH_ISSUES }}
          FAULTLINE_PUBLISH_REPOSITORY: ${{ vars.FAULTLINE_PUBLISH_REPOSITORY }}
          FAULTLINE_PUBLISH_REPOSITORY_ID: ${{ vars.FAULTLINE_PUBLISH_REPOSITORY_ID }}
          FAULTLINE_BASE_BRANCH: ${{ vars.FAULTLINE_BASE_BRANCH }}
          FAULTLINE_PROJECT: ${{ vars.FAULTLINE_PROJECT }}
          FAULTLINE_HARNESSES: ${{ vars.FAULTLINE_HARNESSES }}
          FAULTLINE_PIPELINE_NAME: ${{ vars.FAULTLINE_PIPELINE_NAME }}
          FAULTLINE_PIPELINE_VERSION: ${{ vars.FAULTLINE_PIPELINE_VERSION }}
          FAULTLINE_URL: ${{ vars.FAULTLINE_URL }}
          FAULTLINE_CORE_URL: ${{ vars.FAULTLINE_CORE_URL }}
          FAULTLINE_EVIDENCE_URL: ${{ vars.FAULTLINE_EVIDENCE_URL }}
          FAULTLINE_ALLOW_HTTP: ${{ vars.FAULTLINE_ALLOW_HTTP }}
          FAULTLINE_TOKEN: ${{ secrets.FAULTLINE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          fail() {
            printf '%s\n' "$1" >&2
            if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then printf 'Faultline publication unavailable; scan verdict unchanged.\n' >> "$GITHUB_STEP_SUMMARY"; fi
            exit 1
          }
          command -v python3 >/dev/null || fail 'Runner requires installed Python >= 3.10.'
          command -v git >/dev/null || fail 'Runner requires installed Git >= 2.39.'
          command -v curl >/dev/null || fail 'Runner requires installed curl >= 8.4.'
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' || fail 'Runner requires installed Python >= 3.10.'
          version=$(git --version)
          [[ $version =~ ^git\ version\ ([0-9]+)\.([0-9]+)\.([0-9]+) ]] || fail 'Cannot identify Git version.'
          (( BASH_REMATCH[1] > 2 || (BASH_REMATCH[1] == 2 && BASH_REMATCH[2] >= 39) )) || fail 'Runner requires installed Git >= 2.39.'
          version=$(curl -q --version)
          [[ $version =~ ^curl\ ([0-9]+)\.([0-9]+)\.([0-9]+) ]] || fail 'Cannot identify curl version.'
          (( BASH_REMATCH[1] > 8 || (BASH_REMATCH[1] == 8 && BASH_REMATCH[2] >= 4) )) || fail 'Runner requires installed curl >= 8.4.'
          [[ ${FAULTLINE_PUBLISH_ISSUES:-} == true && ${GITHUB_EVENT_NAME:-} == pull_request_target ]] || fail 'Publication not enabled for this event.'
          [[ ${GITHUB_REPOSITORY:-} =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && $GITHUB_REPOSITORY == "${FAULTLINE_PUBLISH_REPOSITORY:-}" ]] || fail 'Publication repository rejected.'
          [[ ${GITHUB_REPOSITORY_ID:-} =~ ^[1-9][0-9]*$ && $GITHUB_REPOSITORY_ID == "${FAULTLINE_PUBLISH_REPOSITORY_ID:-}" ]] || fail 'Publication repository ID rejected.'
          [[ ${GITHUB_SHA:-} =~ ^[0-9a-f]{40}$ && ${#GITHUB_SHA} == 40 ]] || fail 'Missing trusted workflow SHA.'
          [[ ${FAULTLINE_RUN_ID:-} =~ ^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$ && ${#FAULTLINE_RUN_ID} == 36 ]] || fail 'Missing validated run UUID.'
          [[ -n ${GITHUB_OUTPUT:-} && -n ${GITHUB_STEP_SUMMARY:-} ]] || fail 'Missing Actions output paths.'
          [[ ${GITHUB_TOKEN:-} =~ ^[!-~]+$ && ${#GITHUB_TOKEN} -le 4096 && ${FAULTLINE_TOKEN:-} =~ ^[!-~]+$ && ${#FAULTLINE_TOKEN} -le 4096 ]] || fail 'Missing private publication credentials.'
          umask 077
          private=$(mktemp -d)
          trap 'rm -rf -- "$private"' EXIT
          printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$private/github.headers"
          printf 'Authorization: Bearer %s\n' "$FAULTLINE_TOKEN" > "$private/faultline.headers"
          unset GITHUB_TOKEN GH_TOKEN FAULTLINE_TOKEN
          status=$(curl -q --silent --proto '=https' --proxy '' --noproxy '*' --connect-timeout 10 --max-time 30 \
            --max-filesize 262144 --header "@$private/github.headers" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' --output "$private/contents" --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/faultline-publish.py?ref=$GITHUB_SHA" 2>/dev/null) || fail 'Trusted helper download unavailable.'
          [[ $status == 200 ]] || fail 'Trusted helper download rejected.'
          (( $(wc -c < "$private/contents") <= 262144 )) || fail 'Trusted helper response oversized.'
          python3 - "$private/contents" "$private/publisher.py" <<'PY' || fail 'Trusted helper identity rejected.'
          import base64, hashlib, json, math, pathlib, sys
          def check(condition):
              if not condition: raise ValueError()
          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result: raise ValueError()
                  result[key] = value
              return result
          def finite(value):
              result = float(value)
              if not math.isfinite(result): raise ValueError()
              return result
          def invalid(_): raise ValueError()
          try:
              value = json.loads(pathlib.Path(sys.argv[1]).read_bytes(), object_pairs_hook=pairs, parse_float=finite, parse_constant=invalid)
              check(type(value) is dict and value.get('type') == 'file' and value.get('path') == '.github/faultline-publish.py' and value.get('encoding') == 'base64')
              check(type(value.get('size')) is int and 0 < value['size'] <= 131072 and type(value.get('content')) is str)
              source = base64.b64decode(''.join(value['content'].splitlines()), validate=True)
              check(len(source) == value['size'])
              source.decode('utf-8')
              actual = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
              check(actual == value.get('sha') == 'd60a4e7e7fcc63d365e732a4a8e97ff8d3ea6251')
              pathlib.Path(sys.argv[2]).write_bytes(source)
          except Exception:
              sys.exit(1)
          PY
          env -i PATH="$PATH" \
            FAULTLINE_URL="$FAULTLINE_URL" FAULTLINE_CORE_URL="$FAULTLINE_CORE_URL" FAULTLINE_EVIDENCE_URL="$FAULTLINE_EVIDENCE_URL" \
            FAULTLINE_ALLOW_HTTP="${FAULTLINE_ALLOW_HTTP:-}" FAULTLINE_PUBLISH_ISSUES="$FAULTLINE_PUBLISH_ISSUES" \
            FAULTLINE_PUBLISH_REPOSITORY="$FAULTLINE_PUBLISH_REPOSITORY" FAULTLINE_PUBLISH_REPOSITORY_ID="$FAULTLINE_PUBLISH_REPOSITORY_ID" \
            FAULTLINE_BASE_BRANCH="$FAULTLINE_BASE_BRANCH" FAULTLINE_PROJECT="$FAULTLINE_PROJECT" FAULTLINE_HARNESSES="$FAULTLINE_HARNESSES" \
            FAULTLINE_PIPELINE_NAME="$FAULTLINE_PIPELINE_NAME" FAULTLINE_PIPELINE_VERSION="$FAULTLINE_PIPELINE_VERSION" \
            FAULTLINE_HEADERS_FILE="$private/faultline.headers" GITHUB_HEADERS_FILE="$private/github.headers" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            python3 "$private/publisher.py" issues --run-id "$FAULTLINE_RUN_ID"
